name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # swiftc で直接組んで、出来上がった .app の --selftest を回す。
  # 画面もネットワークも設定も触らないので、ランナーで動く。
  ci:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      # Sparkle は build.sh が無ければ取ってくる。毎回取らずに済ませる。
      - uses: actions/cache@v6
        with:
          path: Vendor
          key: ${{ runner.os }}-vendor-${{ hashFiles('build.sh') }}
      # 整形の規則は .swift-format にある。既定との差は字下げ4つと行幅120だけ。
      - run: swift format lint --strict -r Sources
      - run: ./build.sh
      - run: ./Gocci.app/Contents/MacOS/Gocci --selftest
      # 組み上がった .app の構造と署名を見る試験。--selftest とは別物。
      - run: ./test.sh
